[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2kb"
version = "0.1.0"
description = "Extract gene-disease metadata from biomedical literature"
authors = [
    { name = "Carmen Montero" }
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = []  # requirements.txt used separately

[project.scripts]
paper2kb = "paper2kb.cli:main"

[tool.setuptools]
packages = ["paper2kb"]

[tool.setuptools.package-dir]
"" = "src"